[package]
name = "dara"
version = "0.1.0"
description = "A fast, local-first spaced-repetition app for macOS"
edition = "2021"
rust-version = "1.97.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "dara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
serde_json = "1.0"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
pulldown-cmark = "0.13.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rusty-s3 = { version = "=0.10.1", default-features = false, features = ["rustcrypto", "xml"] }
tauri = { version = "2.11.3", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
refinery = { version = "=0.9.2", features = ["rusqlite"] }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
sha2 = "0.10.9"
sqlite-vec = "=0.1.9"
thiserror = "2.0"
time = { version = "0.3.53", features = ["formatting", "parsing"] }
uuid = { version = "=1.23.5", features = ["v7"] }
webp = { version = "=0.3.1", default-features = false }
zeroize = "=1.8.2"

[dev-dependencies]
tempfile = "3.23"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
libc = "=0.2.186"
objc2 = "0.6.1"
objc2-app-kit = "0.3.1"
objc2-foundation = "0.3.2"
objc2-vision = "0.3.2"
objc2-web-kit = "0.3.2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
keyring = { version = "=4.1.5", default-features = false, features = ["v1"] }
