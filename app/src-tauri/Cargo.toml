[package]
name = "dara"
version = "0.1.0"
description = "A fast, local-first spaced-repetition app for macOS"
edition = "2021"
rust-version = "1.97.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "dara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
refinery = { version = "=0.9.2", features = ["rusqlite"] }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
sha2 = "0.10.9"
sqlite-vec = "=0.1.9"
thiserror = "2.0"
time = "0.3.53"
uuid = { version = "=1.23.5", features = ["v7"] }

[dev-dependencies]
tempfile = "3.23"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
objc2-app-kit = "0.3.1"
tauri-plugin-global-shortcut = "2"
