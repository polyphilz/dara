name: Frontend nightly stress

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  browser-stress:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble@sha256:57b65fdc9ceabe0ef613124c7bbe2babcf9362c4d85e382fe3b03604e84b428a
    strategy:
      fail-fast: false
      matrix:
        workers: ['1', '50%']
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Burn in browser journeys
        run: pnpm exec playwright test --project=chromium-functional --repeat-each=10 --workers=${{ matrix.workers }} --fail-on-flaky-tests
      - name: Upload stress traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-stress-${{ matrix.workers }}
          path: app/test-results/playwright/
          if-no-files-found: warn

  property-stress:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:properties:stress
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: property-stress-seeds
          path: app/test-results/properties/seeds.json
          if-no-files-found: error
