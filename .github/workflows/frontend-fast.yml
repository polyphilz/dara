name: Frontend fast

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: frontend-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-fast:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build production frontend
        run: DARA_BUNDLE_REPORT_PATH=node_modules/.tmp/dara-bundle-report.json pnpm build

      - name: Run domain tests
        run: pnpm test:domain

      - name: Run fixed-seed properties
        run: pnpm test:properties

      - name: Run UI tests and collect frontend coverage
        run: pnpm test:coverage

      - name: Prove production bundle isolation
        run: pnpm test:bundle-safety:check

      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-fast-evidence
          path: |
            app/coverage/frontend/coverage-summary.json
            app/node_modules/.tmp/dara-bundle-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
