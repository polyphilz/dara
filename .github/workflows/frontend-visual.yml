name: Frontend visual

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate canonical macOS/WebKit baselines as an artifact
        required: false
        type: boolean
        default: false

concurrency:
  group: frontend-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-visual:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install the pinned WebKit browser
        run: pnpm exec playwright install webkit
      - name: Compare canonical WebKit DPR-1 and focused DPR-2 baselines
        id: visual_compare
        if: ${{ inputs.update_snapshots != true }}
        continue-on-error: true
        run: pnpm test:visual
      - name: Upload visual diagnostics
        if: ${{ !cancelled() && steps.visual_compare.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-visual-diagnostics
          path: |
            app/playwright-report/
            app/test-results/playwright/
          if-no-files-found: warn
          retention-days: 14
      - name: Generate canonical WebKit baselines
        if: ${{ !cancelled() && (inputs.update_snapshots == true || steps.visual_compare.outcome == 'failure') }}
        env:
          DARA_CANONICAL_VISUAL_UPDATE: '1'
        run: pnpm test:visual:update
      - name: Upload canonical WebKit baselines
        if: ${{ !cancelled() && (inputs.update_snapshots == true || steps.visual_compare.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-visual-baselines-${{ github.run_id }}
          path: |
            app/tests/browser/__screenshots__/webkit-visual/
            app/tests/browser/__screenshots__/webkit-hidpi-visual/
          if-no-files-found: error
          retention-days: 14
      - name: Report the visual comparison failure
        if: ${{ !cancelled() && steps.visual_compare.outcome == 'failure' }}
        run: |
          echo 'Canonical WebKit screenshots differ. Download the frontend-visual-baselines artifact, inspect it, and replace the reviewed baselines.'
          exit 1
