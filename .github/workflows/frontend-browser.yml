name: Frontend browser

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: frontend-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble@sha256:57b65fdc9ceabe0ef613124c7bbe2babcf9362c4d85e382fe3b03604e84b428a
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Browser functional, WebKit contract, and accessibility
        run: pnpm test:browser
      - name: Upload browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-diagnostics
          path: |
            app/playwright-report/
            app/test-results/playwright/
          if-no-files-found: warn
          retention-days: 14
